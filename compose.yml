services:
    game-database:
      image: postgres:18.3
      environment:
        POSTGRES_DB: gamedb
        POSTGRES_USER: app
        POSTGRES_PASSWORD: app
      ports:
        - "5433:5432"
      volumes:
        - game_data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U app -d gamedb"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
volumes:
  game_data: